<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="description" content="ALURA LABS - Hub de Desafios da Imersão Alura">
  <meta name="theme-color" content="#111113">
  <title>ALURA LABS — Hub de Desafios da Imersão</title>

  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Tipografia do Google Fonts com fallback local de sistema -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Estilos da Aplicação -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/home.css">

  <link rel="stylesheet" href="css/calculator-advanced.css">

  <div class="app-container">
    <!-- Barra de Navegação -->
    <div id="navbar-mount"></div>

      <div style="max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem;">

          <strong style="color: #fff;">ALURA<span style="color: var(--color-primary);">LABS</span></strong> • Imersão Alura

        </div>
      </div>
    </footer>

  <script src="js/utils/mathEvaluator.js"></script>

  <script src="js/components/Navigation.js"></script>
  <script src="js/components/Home.js"></script>
  <script src="js/components/SimpleCalculator.js"></script>
  <script src="js/components/AdvancedCalculator.js"></script>
  <script src="js/components/TodoList.js"></script>
